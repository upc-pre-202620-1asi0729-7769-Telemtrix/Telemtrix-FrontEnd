<form (ngSubmit)="onSubmit()" #form="ngForm" class="form-grid">
  <div class="form-group">
    <label>{{ 'incidents.vehicle' | translate }}</label>
    <input type="number" [(ngModel)]="incident.vehicleId" name="vehicleId" required min="1">
  </div>
  <div class="form-group">
    <label>{{ 'incidents.driver' | translate }}</label>
    <input type="number" [(ngModel)]="incident.driverId" name="driverId" required min="1">
  </div>
  <div class="form-group full-width">
    <label>{{ 'incidents.description' | translate }}</label>
    <textarea [(ngModel)]="incident.description" name="description" required rows="3"></textarea>
  </div>
  <div class="form-group">
    <label>{{ 'incidents.severity' | translate }}</label>
    <select [(ngModel)]="incident.severity" name="severity" required>
      <option value="LOW">{{ 'incidents.severity-low' | translate }}</option>
      <option value="MEDIUM">{{ 'incidents.severity-medium' | translate }}</option>
      <option value="HIGH">{{ 'incidents.severity-high' | translate }}</option>
      <option value="CRITICAL">{{ 'incidents.severity-critical' | translate }}</option>
    </select>
  </div>
  <div class="form-group">
    <label>{{ 'incidents.date' | translate }}</label>
    <input type="datetime-local" [(ngModel)]="incident.date" name="date" required>
  </div>
  <div class="form-actions">
    <button type="button" class="btn-cancel" (click)="onCancel()">{{ 'common.cancel' | translate }}</button>
    <button type="submit" class="btn-save" [disabled]="!form.valid">{{ 'common.save' | translate }}</button>
  </div>
</form>
