<form (ngSubmit)="onSubmit()" #form="ngForm" class="form-grid">
  <div class="form-group">
    <label>{{ 'telemetry.vehicle' | translate }}</label>
    <input type="number" [(ngModel)]="record.vehicleId" name="vehicleId" required min="1">
  </div>
  <div class="form-group">
    <label>{{ 'telemetry.speed' | translate }}</label>
    <input type="number" [(ngModel)]="record.speed" name="speed" required min="0">
  </div>
  <div class="form-group">
    <label>{{ 'telemetry.fuel' | translate }}</label>
    <input type="number" [(ngModel)]="record.fuelLevel" name="fuelLevel" required min="0" max="100">
  </div>
  <div class="form-group">
    <label>{{ 'telemetry.temp' | translate }}</label>
    <input type="number" [(ngModel)]="record.engineTemperature" name="engineTemperature" required>
  </div>
  <div class="form-group">
    <label>{{ 'telemetry.latitude' | translate }}</label>
    <input type="number" step="0.0001" [(ngModel)]="record.latitude" name="latitude" required>
  </div>
  <div class="form-group">
    <label>{{ 'telemetry.longitude' | translate }}</label>
    <input type="number" step="0.0001" [(ngModel)]="record.longitude" name="longitude" required>
  </div>
  <div class="form-group full-width">
    <label>{{ 'telemetry.timestamp' | translate }}</label>
    <input type="datetime-local" [(ngModel)]="record.timestamp" name="timestamp" required>
  </div>
  <div class="form-actions">
    <button type="button" class="btn-cancel" (click)="onCancel()">{{ 'common.cancel' | translate }}</button>
    <button type="submit" class="btn-save" [disabled]="!form.valid">{{ 'common.save' | translate }}</button>
  </div>
</form>
