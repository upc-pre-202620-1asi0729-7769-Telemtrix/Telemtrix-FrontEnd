<form (ngSubmit)="onSubmit()" #form="ngForm" class="form-grid">
  <div class="form-group">
    <label>{{ 'inspections.vehicle' | translate }}</label>
    <input type="number" [(ngModel)]="inspection.vehicleId" name="vehicleId" required min="1">
  </div>
  <div class="form-group">
    <label>{{ 'inspections.inspector' | translate }}</label>
    <input type="number" [(ngModel)]="inspection.inspectorId" name="inspectorId" required min="1">
  </div>
  <div class="form-group full-width">
    <label>{{ 'inspections.date' | translate }}</label>
    <input type="datetime-local" [(ngModel)]="inspection.date" name="date" required>
  </div>

  <div class="form-group full-width">
    <label>{{ 'inspections.items' | translate }}</label>
    <div class="checklist">
      <div class="checklist-row" *ngFor="let item of inspection.items; let i = index">
        <span class="checklist-name">{{ item.name }}</span>
        <select [(ngModel)]="inspection.items[i].status" [name]="'item-' + i" required>
          <option value="OK">{{ 'inspections.item-ok' | translate }}</option>
          <option value="FAIL">{{ 'inspections.item-fail' | translate }}</option>
        </select>
      </div>
    </div>
  </div>

  <div class="form-group full-width">
    <label>{{ 'inspections.observations' | translate }}</label>
    <textarea [(ngModel)]="inspection.observations" name="observations" rows="3"></textarea>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-cancel" (click)="onCancel()">{{ 'common.cancel' | translate }}</button>
    <button type="submit" class="btn-save" [disabled]="!form.valid">{{ 'common.save' | translate }}</button>
  </div>
</form>
